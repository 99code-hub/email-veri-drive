name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: "testing"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "::warning::requirements.txt not found; installing base deps only"
          }
          # pyperclip is required by testing.py for the Ctrl+V paste into the Share box
          pip install pyperclip
          pip install pyinstaller

      - name: Show installed packages
        run: |
          python --version
          pip freeze

      - name: Verify runtime imports (pre-build sanity check)
        run: |
          python -c "import pyperclip, selenium; print('pyperclip ok'); print('selenium', selenium.__version__)"

      - name: Ensure PyInstaller spec exists
        run: |
          if (-not (Test-Path testing.spec)) {
            Write-Error "testing.spec is missing — the build cannot proceed."
            exit 1
          }

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm testing.spec

      - name: Verify EXE was produced
        run: |
          if (-not (Test-Path "dist\${{ env.APP_NAME }}.exe")) {
            Write-Error "dist/${{ env.APP_NAME }}.exe was not produced."
            exit 1
          }
          $exe = Get-Item "dist\${{ env.APP_NAME }}.exe"
          Write-Host "EXE size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          if ($exe.Length -lt 1MB) {
            Write-Error "EXE is suspiciously small ($($exe.Length) bytes) — build likely failed."
            exit 1
          }

      - name: Smoke test EXE (launch + timeout)
        timeout-minutes: 2
        run: |
          $logDir = "smoke-test-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $stdinFile  = Join-Path $logDir "stdin.txt"
          $stdoutFile = Join-Path $logDir "stdout.txt"
          $stderrFile = Join-Path $logDir "stderr.txt"

          # 1. Start-Process requires the stdin file to EXIST before it is invoked.
          #    Creating it first is what the previous version got wrong.
          "" | Out-File -FilePath $stdinFile -Encoding ASCII

          # 2. Prevent the EXE from launching a real Chrome session during CI.
          #    With no credentials.txt the script fails fast on load_credentials(),
          #    which is exactly what we want to exercise here (it proves imports
          #    resolved before hitting the missing-file error).
          if (Test-Path "credentials.txt") {
            Write-Host "Temporarily moving credentials.txt aside for smoke test."
            Rename-Item "credentials.txt" "credentials.txt.skipped" -Force
          }

          $proc = Start-Process -FilePath "dist\${{ env.APP_NAME }}.exe" `
                                -RedirectStandardInput  $stdinFile `
                                -RedirectStandardOutput $stdoutFile `
                                -RedirectStandardError  $stderrFile `
                                -PassThru

          Start-Sleep -Seconds 10

          if (-not $proc.HasExited) {
            Write-Host "EXE still running after 10s — killing (expected: waits on input())."
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Host "EXE exited with code $($proc.ExitCode)."
          }

          Write-Host "----- stdout -----"
          if (Test-Path $stdoutFile) { Get-Content $stdoutFile }
          Write-Host "----- stderr -----"
          if (Test-Path $stderrFile) { Get-Content $stderrFile }

          # 3. Fail the job only on the failure mode we actually care about:
          #    a missing bundled module (e.g. pyperclip not collected by PyInstaller).
          $err = if (Test-Path $stderrFile) { Get-Content $stderrFile -Raw } else { "" }
          if ($err -and $err -match "ModuleNotFoundError|ImportError|No module named") {
            Write-Error "EXE crashed with a missing module at runtime:`n$err"
            exit 1
          }
          Write-Host "Smoke test passed — no missing-module errors."

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ github.sha }}
          path: smoke-test-logs/
          if-no-files-found: ignore

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-${{ github.sha }}
          path: |
            dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error

      - name: Upload build logs (if build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build
            *.spec
            *.log
            smoke-test-logs/
          if-no-files-found: ignore
